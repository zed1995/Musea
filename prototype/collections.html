<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea - Collections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'google-sans': ['Google Sans', 'sans-serif'],
                        'google-sans-display': ['Google Sans Display', 'sans-serif'],
                    },
                    colors: {
                        'white': '#FFFFFF',
                        'black': '#000000',
                        'gray-50': '#FAFAFA',
                        'gray-100': '#F5F5F5',
                        'gray-200': '#E5E5E5',
                        'gray-300': '#D4D4D4',
                        'gray-400': '#A3A3A3',
                        'gray-500': '#737373',
                        'gray-600': '#525252',
                        'gray-700': '#404040',
                        'gray-800': '#262626',
                        'gray-900': '#171717',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Google Sans', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            overflow-x: hidden;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple:active::after {
            width: 200px;
            height: 200px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }

        .collection-card {
            background: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .collection-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .collection-cover {
            width: 100%;
            aspect-ratio: 2/1;
            object-fit: cover;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 72px;
        }

        .nav-item.active {
            background: #F5F5F5;
        }

        .nav-item.active .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        .nav-item:not(.active):hover {
            background: #FAFAFA;
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #F5F5F5;
        }

        .add-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #262626;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-white">
    <div class="w-[412px] h-[915px] mx-auto relative overflow-hidden">
        <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width: 412px; margin: 0 auto;">
            <div class="flex items-center gap-1">
                <span class="text-sm font-medium text-black">12:30</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="material-symbols-rounded text-lg text-black">signal_cellular_alt</span>
                <span class="material-symbols-rounded text-lg text-black">wifi</span>
                <span class="material-symbols-rounded text-lg text-black">battery_full</span>
            </div>
        </div>

        <div class="pt-10 pb-20 h-full overflow-y-auto scrollbar-hide">
            <div class="px-4 sticky top-0 bg-white/98 backdrop-blur-md z-40 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold text-black">Collections</h1>
                    <button class="add-btn ripple">
                        <span class="material-symbols-rounded text-xl text-white">add</span>
                    </button>
                </div>
            </div>

            <div class="px-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Travel Inspiration</h3>
                            <p class="text-sm text-gray-600">24 photos</p>
                        </div>
                    </div>

                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682687221038-404cb8830901?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Wallpaper</h3>
                            <p class="text-sm text-gray-600">8 photos</p>
                        </div>
                    </div>

                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682695794947-17061dc284dd?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Design Reference</h3>
                            <p class="text-sm text-gray-600">15 photos</p>
                        </div>
                    </div>

                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Nature</h3>
                            <p class="text-sm text-gray-600">32 photos</p>
                        </div>
                    </div>

                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682686581030-7fa4ea2b96c3?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Architecture</h3>
                            <p class="text-sm text-gray-600">18 photos</p>
                        </div>
                    </div>

                    <div class="collection-card ripple cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538?w=400&h=200&fit=crop" alt="Cover" class="collection-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-base font-semibold text-black mb-1">Food</h3>
                            <p class="text-sm text-gray-600">12 photos</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav fixed bottom-0 left-0 right-0 px-2 py-2 flex items-center justify-around z-40" style="width: 412px; margin: 0 auto;">
            <div class="nav-item">
                <span class="material-symbols-rounded text-2xl text-gray-500">explore</span>
                <span class="text-xs text-gray-500">Discover</span>
            </div>
            <div class="nav-item">
                <span class="material-symbols-rounded text-2xl text-gray-500">search</span>
                <span class="text-xs text-gray-500">Explore</span>
            </div>
            <div class="nav-item active">
                <span class="material-symbols-rounded text-2xl text-black">collections_bookmark</span>
                <span class="text-xs text-black font-medium">Collections</span>
            </div>
            <div class="nav-item">
                <span class="material-symbols-rounded text-2xl text-gray-500">person</span>
                <span class="text-xs text-gray-500">Profile</span>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 h-1 flex items-center justify-center bg-transparent z-50" style="width: 412px; margin: 0 auto; bottom: 8px;">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>
</body>
</html>
