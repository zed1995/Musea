<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea — Delete Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { zinc: { 50: '#FAFAFA', 100: '#F4F4F5', 200: '#E4E4E7', 300: '#D4D4D8', 400: '#A1A1AA', 500: '#71717A', 600: '#52525B', 700: '#3F3F46', 800: '#27272A', 900: '#18181B', 950: '#09090B' } }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #111; overflow-x: hidden; }
        .icon { width: 20px; height: 20px; display: block; flex-shrink: 0; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .status-bar { background: rgba(255,255,255,0.98); }
        .hero { position: relative; min-height: 328px; background: linear-gradient(180deg, rgba(10,10,10,0.10) 0%, rgba(10,10,10,0.22) 35%, rgba(10,10,10,0.66) 100%), url('https://images.unsplash.com/photo-1533788989278-6f9cce0452f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080') center/cover no-repeat; }
        .hero-topbar button { min-width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .overlay-hit { position: absolute; inset: 0; background: rgba(24,24,27,0.18); backdrop-filter: blur(4px); }
        .sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: radial-gradient(circle at top right, rgba(244,244,245,0.92), transparent 30%), linear-gradient(180deg, #FFFDFC 0%, #FFFFFF 22%, #FBFBFB 100%); box-shadow: 0 -18px 46px rgba(9,9,11,0.18); border-top: 1px solid rgba(255,255,255,0.92); }
        .sheet-pill { width: 54px; height: 5px; border-radius: 999px; background: #D4D4D8; margin: 10px auto 0; }
        .danger-note { border-radius: 18px; background: #FEF2F2; border: 1px solid #FECACA; }
        .input-shell { border-radius: 20px; border: 1px solid #E7E7EB; background: #fff; box-shadow: 0 10px 24px rgba(24,24,27,0.04); }
        .danger-cta { height: 54px; border-radius: 18px; background: #DC2626; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
        .secondary-cta { height: 50px; border-radius: 18px; border: 1px solid #E4E4E7; background: #fff; color: #27272A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
    </style>
</head>
<body>
<div class="w-[412px] h-[915px] mx-auto relative overflow-hidden bg-white">
    <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width:412px;margin:0 auto;">
        <span class="text-sm font-semibold text-zinc-900">12:30</span>
        <div class="flex items-center gap-2">
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v4"/><path d="M12 11v9"/><path d="M17 6v14"/></svg>
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><rect x="5" y="7" width="13" height="10" rx="2"/><path d="M21 11v2"/><path fill="currentColor" stroke="none" d="M8 10h7v4H8z"/></svg>
        </div>
    </div>
    <div class="pt-[52px] h-full overflow-y-auto">
        <section class="hero">
            <div class="hero-topbar absolute inset-x-0 top-0 z-10 px-3 pt-3 flex items-center justify-between">
                <button aria-label="Back"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
                <div class="flex items-center gap-2">
                    <button aria-label="Manage"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v7"/><path d="M19 21h-7a2 2 0 0 1-2-2v-7"/><path d="M21 12V5a2 2 0 0 0-2-2h-7"/><path d="M3 12v7a2 2 0 0 0 2 2h7"/><path d="M8 8h.01"/><path d="M16 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/></svg></button>
                    <button aria-label="Share"><svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m8 8 4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
                </div>
            </div>
        </section>
        <div class="overlay-hit z-20"></div>
        <div class="sheet z-30">
            <div class="sheet-pill"></div>
            <div class="px-4 pt-4 pb-5">
                <div class="flex items-start justify-between gap-3 mb-4">
                    <div>
                        <h2 class="text-[23px] leading-none tracking-[-0.05em] font-bold text-red-600">Delete collection?</h2>
                        <p class="mt-2 text-sm leading-relaxed text-zinc-500 pr-4">This permanently removes the collection and its saved links.</p>
                    </div>
                    <button class="w-9 h-9 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-500 text-sm font-bold">x</button>
                </div>
                <div class="danger-note px-4 py-4 mb-4">
                    <div class="text-sm font-semibold text-red-600">Kyoto Research will be deleted</div>
                    <div class="mt-2 text-sm leading-relaxed text-red-400">The photos remain on Unsplash, but this collection cannot be restored once removed.</div>
                </div>
                <div class="input-shell px-4 py-4 mb-4">
                    <div class="text-[11px] font-bold uppercase tracking-[0.18em] text-zinc-400 mb-2">Type to confirm</div>
                    <div class="text-[18px] leading-tight tracking-[-0.03em] font-semibold text-zinc-950">KYOTO RESEARCH</div>
                </div>
                <div class="space-y-3">
                    <div class="danger-cta">Delete collection</div>
                    <div class="secondary-cta">Cancel</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
