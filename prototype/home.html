<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea — Discover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { zinc: { 50: '#FAFAFA', 100: '#F4F4F5', 200: '#E4E4E7', 300: '#D4D4D8', 400: '#A1A1AA', 500: '#71717A', 600: '#52525B', 700: '#3F3F46', 800: '#27272A', 900: '#18181B', 950: '#09090B' } }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #fff;
            color: #111;
            overflow-x: hidden;
        }

        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        .icon {
            width: 20px;
            height: 20px;
            display: block;
            flex-shrink: 0;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .icon-sm { width: 16px; height: 16px; }
        .icon-lg { width: 22px; height: 22px; }
        .icon-fill { fill: currentColor; stroke: none; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .status-bar { background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); }

        /* Search */
        .search-bar {
            background: #F7F7F7; border-radius: 999px; height: 42px;
            padding: 0 10px 0 15px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .search-bar:hover { background: #F0F0F0; }
        .search-bar:focus-within { background: #fff; box-shadow: 0 0 0 1px #D8D8D8; }

        .shuffle-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: #111; display: flex; align-items: center;
            justify-content: center; transition: all 0.15s ease; cursor: pointer; flex-shrink: 0;
        }
        .shuffle-btn:hover { opacity: 0.8; }

        /* Tabs */
        .topic-tabs {
            border-bottom: 1px solid #F0F0F0;
        }

        .tab-btn {
            padding: 8px 0 10px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.15s ease; user-select: none;
            color: #777; border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .tab-btn.active { color: #111; border-bottom-color: #111; }
        .tab-btn:not(.active):hover { color: #333; }

        /* Photo card */
        .photo-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            transition: filter 0.25s ease;
            cursor: zoom-in;
            background: #fff;
        }
        .photo-card:hover { filter: brightness(0.98); }
        .photo-card > img { width: 100%; display: block; transition: filter 0.3s ease; }

        .photo-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 46px 12px 12px;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.03) 22%, rgba(0,0,0,0.22) 68%, rgba(0,0,0,0.50) 100%);
            display: flex; align-items: flex-end; justify-content: space-between;
            line-height: 1.2;
        }

        .card-meta {
            width: 100%;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .user-info {
            display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0;
            padding: 3px 0;
        }

        .user-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            object-fit: cover;
            flex-shrink: 0; user-select: none;
            box-shadow: 0 1px 5px rgba(0,0,0,0.22);
        }

        .user-name {
            color: #fff; font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0,0,0,0.28);
        }

        .action-btn {
            display: flex; align-items: center; gap: 2px;
            min-height: 28px;
            padding: 0 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff; cursor: pointer; transition: all 0.15s ease;
            font-size: 11px; font-weight: 600; line-height: 1;
            text-shadow: 0 1px 3px rgba(0,0,0,0.25);
        }
        .action-btn:hover { background: rgba(255,255,255,0.22); }
        .action-btn.active .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
        .action-btn.icon-only {
            width: 28px;
            padding: 0;
            justify-content: center;
        }
        .action-btn .icon { width: 14px; height: 14px; }
        .action-buttons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        /* Bottom nav */
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 5px 8px; border-radius: 10px; cursor: pointer;
            transition: all 0.15s ease; min-width: 64px;
            color: #A1A1AA;
        }
        .nav-item.active { color: #111; }
        .nav-item:not(.active):hover { background: transparent; }

        .bottom-nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="w-[412px] h-[915px] mx-auto relative overflow-hidden bg-white">

    <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width:412px;margin:0 auto;">
        <span class="text-sm font-semibold text-zinc-900">12:30</span>
        <div class="flex items-center gap-2">
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v4"/><path d="M12 11v9"/><path d="M17 6v14"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="13" height="10" rx="2"/><path d="M21 11v2"/><path class="icon-fill" d="M8 10h7v4H8z"/></svg>
        </div>
    </div>

    <div class="pt-[52px] pb-[56px] h-full overflow-y-auto scrollbar-hide">

        <!-- Search -->
        <div class="sticky top-0 z-40 px-3 pt-3 pb-2 bg-white/95 backdrop-blur-md">
            <div class="search-bar">
                <svg class="icon text-zinc-400" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
                <span class="text-sm text-zinc-400 flex-1">Search photos...</span>
                <div class="shuffle-btn">
                    <svg class="icon text-white" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 3 3-3 3"/><path d="m18 4 3 3-3 3"/><path d="M3 7h3c4 0 5 10 9 10h6"/><path d="M3 17h3c1.6 0 2.7-1.5 3.7-3.4"/></svg>
                </div>
            </div>
        </div>

        <!-- Topic tabs -->
        <div class="topic-tabs px-3 pt-1 mb-3 flex items-center gap-5 overflow-x-auto scrollbar-hide">
            <span class="tab-btn active">All</span>
            <span class="tab-btn">Nature</span>
            <span class="tab-btn">Architecture</span>
            <span class="tab-btn">People</span>
            <span class="tab-btn">Travel</span>
            <span class="tab-btn">Food</span>
            <span class="tab-btn">Animals</span>
            <span class="tab-btn">Technology</span>
        </div>

        <!-- Feed -->
        <div class="px-3 flex flex-col gap-3.5">
            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=1080&fit=crop" alt="Landscape" loading="lazy">
                <div class="photo-overlay">
                    <div class="card-meta">
                        <div class="user-info">
                            <img class="user-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&h=80&fit=crop&crop=face" alt="John Doe">
                            <span class="user-name">John Doe</span>
                        </div>
                        <div class="action-buttons">
                            <div class="action-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>1.2k</div>
                            <div class="action-btn icon-only"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1682687221038-404cb8830901?w=1080&fit=crop" alt="Landscape" loading="lazy">
                <div class="photo-overlay">
                    <div class="card-meta">
                        <div class="user-info">
                            <img class="user-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face" alt="Jane Smith">
                            <span class="user-name">Jane Smith</span>
                        </div>
                        <div class="action-buttons">
                            <div class="action-btn active"><svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>2.1k</div>
                            <div class="action-btn icon-only"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1682695794947-17061dc284dd?w=1080&fit=crop" alt="Nature" loading="lazy">
                <div class="photo-overlay">
                    <div class="card-meta">
                        <div class="user-info">
                            <img class="user-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop&crop=face" alt="Alex Wang">
                            <span class="user-name">Alex Wang</span>
                        </div>
                        <div class="action-buttons">
                            <div class="action-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>512</div>
                            <div class="action-btn icon-only active"><svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=1080&fit=crop" alt="Portrait" loading="lazy">
                <div class="photo-overlay">
                    <div class="card-meta">
                        <div class="user-info">
                            <img class="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80&h=80&fit=crop&crop=face" alt="Sarah Lee">
                            <span class="user-name">Sarah Lee</span>
                        </div>
                        <div class="action-buttons">
                            <div class="action-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>3.4k</div>
                            <div class="action-btn icon-only"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <img src="https://images.unsplash.com/photo-1682686581030-7fa4ea2b96c3?w=1080&fit=crop" alt="Architecture" loading="lazy">
                <div class="photo-overlay">
                    <div class="card-meta">
                        <div class="user-info">
                            <img class="user-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=80&h=80&fit=crop&crop=face" alt="Emily Chen">
                            <span class="user-name">Emily Chen</span>
                        </div>
                        <div class="action-buttons">
                            <div class="action-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>892</div>
                            <div class="action-btn icon-only"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="bottom-nav fixed bottom-0 left-0 right-0 px-4 py-1.5 flex items-center justify-around z-40" style="width:412px;margin:0 auto;">
        <div class="nav-item active">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m14.8 9.2-1.7 4-4 1.7 1.7-4z"/></svg>
            <span class="text-[10px] text-zinc-900 font-semibold tracking-wide">Discover</span>
        </div>
        <div class="nav-item">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
            <span class="text-[10px] text-zinc-400 tracking-wide">Explore</span>
        </div>
        <div class="nav-item">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4v8l3-2 3 2V4"/></svg>
            <span class="text-[10px] text-zinc-400 tracking-wide">Collections</span>
        </div>
        <div class="nav-item">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span class="text-[10px] text-zinc-400 tracking-wide">Profile</span>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 flex justify-center z-50" style="width:412px;margin:0 auto;bottom:4px;">
        <div class="w-32 h-1 bg-zinc-300 rounded-full"></div>
    </div>
</div>

</body>
</html>
