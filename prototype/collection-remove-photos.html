<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea — Remove Collection Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { zinc: { 50: '#FAFAFA', 100: '#F4F4F5', 200: '#E4E4E7', 300: '#D4D4D8', 400: '#A1A1AA', 500: '#71717A', 600: '#52525B', 700: '#3F3F46', 800: '#27272A', 900: '#18181B', 950: '#09090B' } }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #111; overflow-x: hidden; }
        .icon { width: 20px; height: 20px; display: block; flex-shrink: 0; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .status-bar { background: rgba(255,255,255,0.98); }
        .topbar-shell { background: rgba(255,255,255,0.98); border-bottom: 1px solid #F1F1F2; }
        .topbar-title { font-size: 20px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; color: #18181B; }
        .topbar-nav-btn { width: 40px; height: 40px; border-radius: 999px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center; color: #27272A; flex-shrink: 0; }
        .topbar-text-btn { min-width: 48px; height: 40px; padding: 0 8px; border-radius: 999px; background: transparent; border: 0; color: #374151; font-size: 13px; font-weight: 600; }
        .section-card { background: #fff; border: 1px solid #F4F4F5; border-radius: 18px; box-shadow: 0 10px 30px rgba(24,24,27,0.04); }
        .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .photo-tile { position: relative; overflow: hidden; border-radius: 18px; background: #F5F5F5; min-height: 182px; }
        .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-tile.selected::after { content: ''; position: absolute; inset: 0; background: rgba(24,24,27,0.22); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7); }
        .select-chip {
            position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
            background: rgba(24,24,27,0.64); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(10px);
        }
        .select-chip.active { background: #18181B; }
        .primary-cta { height: 54px; border-radius: 18px; background: #18181B; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; }
    </style>
</head>
<body>
<div class="w-[412px] h-[915px] mx-auto relative overflow-hidden bg-white">
    <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width:412px;margin:0 auto;">
        <span class="text-sm font-semibold text-zinc-900">12:30</span>
        <div class="flex items-center gap-2">
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v4"/><path d="M12 11v9"/><path d="M17 6v14"/></svg>
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <svg class="icon text-zinc-800" viewBox="0 0 24 24"><rect x="5" y="7" width="13" height="10" rx="2"/><path d="M21 11v2"/><path fill="currentColor" stroke="none" d="M8 10h7v4H8z"/></svg>
        </div>
    </div>
    <div class="pt-[52px] pb-6 h-full overflow-y-auto">
        <div class="sticky top-0 z-40 topbar-shell px-4 pt-3 pb-3">
            <div class="flex items-center justify-between">
                <button class="topbar-nav-btn" aria-label="Back">
                    <svg class="icon text-zinc-700" viewBox="0 0 24 24"><path d="M20 12H5"/><path d="m11 18-6-6 6-6"/></svg>
                </button>
                <h1 class="topbar-title">Remove photos</h1>
                <button class="topbar-text-btn">Done</button>
            </div>
        </div>
        <div class="px-3 pt-4">
            <section class="section-card p-3 mb-3">
                <div>
                    <div>
                        <p class="text-sm leading-relaxed text-zinc-500">Select multiple photos to remove them from this collection. Photos stay available on Unsplash.</p>
                    </div>
                </div>
            </section>
            <section class="section-card p-3 mb-3">
                <div class="flex items-center justify-between">
                    <div class="text-[11px] uppercase tracking-[0.12em] text-zinc-400 font-bold">Selection</div>
                    <div class="px-3 h-7 rounded-full bg-zinc-950 text-white text-[11px] font-bold inline-flex items-center">3 selected</div>
                </div>
            </section>
            <div class="photo-grid mb-4">
                <div class="photo-tile selected"><img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?fit=crop&w=500&q=80" alt=""><div class="select-chip active">✓</div></div>
                <div class="photo-tile"><img src="https://images.unsplash.com/photo-1512850183-6d7990f42385?fit=crop&w=500&q=80" alt=""><div class="select-chip">○</div></div>
                <div class="photo-tile selected"><img src="https://images.unsplash.com/photo-1527631746610-bca00a040d60?fit=crop&w=500&q=80" alt=""><div class="select-chip active">✓</div></div>
                <div class="photo-tile"><img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?fit=crop&w=500&q=80" alt=""><div class="select-chip">○</div></div>
                <div class="photo-tile selected"><img src="https://images.unsplash.com/photo-1529429617124-aee711a5ac1c?fit=crop&w=500&q=80" alt=""><div class="select-chip active">✓</div></div>
                <div class="photo-tile"><img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?fit=crop&w=500&q=80" alt=""><div class="select-chip">○</div></div>
            </div>
            <section class="section-card p-3 mb-4">
                <div class="text-sm font-semibold text-zinc-950">Selection summary</div>
                <p class="mt-2 text-sm leading-relaxed text-zinc-500">3 photos will be removed from <span class="font-semibold text-zinc-700">Kyoto Research</span>. This does not delete the original photos.</p>
            </section>
            <div class="primary-cta">Remove 3 photos</div>
        </div>
    </div>
</div>
</body>
</html>
