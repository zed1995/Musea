<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea — Search Photos Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #111; overflow-x: hidden; }
        .icon {
            width: 20px;
            height: 20px;
            display: block;
            flex-shrink: 0;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-sm { width: 16px; height: 16px; }
        .status-bar { background: rgba(255,255,255,0.98); }
        .search-shell {
            background: rgba(255,255,255,0.98);
            border-bottom: 1px solid #F1F1F2;
        }
        .search-input {
            min-height: 44px;
            border-radius: 999px;
            background: #F6F6F7;
            border: 1px solid #ECECF0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
        }
        .segment {
            min-height: 34px;
            padding: 0 16px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #71717A;
            white-space: nowrap;
        }
        .segment.active { background: #18181B; color: #fff; }
        .filter-trigger {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid #18181B;
            background: #18181B;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }
        .overlay-layer {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 35;
            pointer-events: none;
        }
        .overlay-hit {
            position: absolute;
            left: 0;
            right: 0;
            top: 286px;
            bottom: 0;
            background: rgba(24,24,27,0.10);
            box-shadow: inset 0 14px 22px rgba(24,24,27,0.12);
            pointer-events: auto;
        }
        .tabs-row {
            position: relative;
            z-index: 46;
        }
        .panel-wrap {
            position: absolute;
            left: -12px;
            right: -12px;
            top: calc(100% + 8px);
            pointer-events: auto;
        }
        .sheet {
            background: #fff;
            border-top: 1px solid #ECECF0;
            border-bottom: 1px solid #ECECF0;
            padding: 12px 16px 14px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .choice {
            min-height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid #ECECF0;
            background: #fff;
            color: #52525B;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
        }
        .choice.active {
            background: #18181B;
            color: #fff;
            border-color: #18181B;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .photo-tile {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: #F5F5F5;
            min-height: 182px;
        }
        .photo-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-tile.tall { min-height: 242px; }
        .photo-tile.medium { min-height: 208px; }
        .tile-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(12,12,12,0) 58%, rgba(12,12,12,0.18) 100%);
        }
        .tile-credit {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .tile-credit-pill {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }
        .tile-credit-pill img {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
        }
        .tile-like-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.35);
        }
    </style>
</head>
<body>
<div class="w-[412px] h-[915px] mx-auto relative overflow-hidden bg-white">
    <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width:412px;margin:0 auto;">
        <span class="text-sm font-semibold text-zinc-900">12:30</span>
        <div class="flex items-center gap-2">
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v4"/><path d="M12 11v9"/><path d="M17 6v14"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><rect x="5" y="7" width="13" height="10" rx="2"/><path d="M21 11v2"/><path fill="currentColor" stroke="none" d="M8 10h7v4H8z"/></svg>
        </div>
    </div>
    <div class="pt-[52px] h-full overflow-y-auto bg-white relative">
        <div class="search-shell sticky top-0 z-40 px-3 pt-3 pb-3">
            <div class="flex items-center gap-2">
                <button class="w-10 h-10 rounded-[12px] border border-zinc-200 bg-white flex items-center justify-center">
                    <svg class="icon text-zinc-700" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="search-input flex-1">
                    <svg class="icon text-zinc-400" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
                    <span class="text-sm text-zinc-900 font-medium flex-1">nature</span>
                    <button class="w-7 h-7 rounded-full bg-zinc-200/80 flex items-center justify-center text-zinc-500 text-xs font-bold">x</button>
                </div>
            </div>
            <div class="tabs-row mt-3 flex items-center gap-2">
                <div class="flex-1 overflow-x-auto">
                    <div class="flex gap-2 min-w-max pr-2">
                        <button class="segment active">Photos</button>
                        <button class="segment">Collections</button>
                        <button class="segment">Users</button>
                    </div>
                </div>
                <button class="filter-trigger" aria-label="Open filters">
                    <svg class="icon text-white" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
                </button>
                <div class="panel-wrap">
                    <div class="sheet">
                        <section class="mb-4">
                            <div class="text-sm font-semibold text-zinc-900 mb-2">Sort by</div>
                            <div class="option-row">
                                <button class="choice active">Relevant</button>
                                <button class="choice">Latest</button>
                            </div>
                        </section>
                        <section class="mb-4">
                            <div class="text-sm font-semibold text-zinc-900 mb-2">Color</div>
                            <div class="option-row">
                                <button class="choice">Any</button>
                                <button class="choice active">Green</button>
                                <button class="choice">Blue</button>
                                <button class="choice">Black & White</button>
                            </div>
                        </section>
                        <section class="mb-4">
                            <div class="text-sm font-semibold text-zinc-900 mb-2">Orientation</div>
                            <div class="option-row">
                                <button class="choice">Any</button>
                                <button class="choice active">Landscape</button>
                                <button class="choice">Portrait</button>
                                <button class="choice">Squarish</button>
                            </div>
                        </section>
                        <section>
                            <div class="text-sm font-semibold text-zinc-900 mb-2">Content safety</div>
                            <div class="option-row">
                                <button class="choice">Low</button>
                                <button class="choice active">High</button>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        <div class="overlay-layer">
            <div class="overlay-hit"></div>
        </div>
        <div class="px-3 pt-4 pb-5">
            <div class="photo-grid">
                <article class="photo-tile tall">
                    <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=900&h=1200&fit=crop" alt="">
                    <div class="tile-gradient"></div>
                    <div class="tile-credit">
                        <div class="tile-credit-pill">
                            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=96&h=96&fit=crop&crop=face" alt="">
                            <span class="text-[11px] font-semibold truncate drop-shadow-[0_1px_3px_rgba(0,0,0,0.35)]">John Doe</span>
                        </div>
                        <span class="tile-like-chip"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>1.2k</span></span>
                    </div>
                </article>
                <article class="photo-tile medium">
                    <img src="https://images.unsplash.com/photo-1682687221038-404cb8830901?w=900&h=1200&fit=crop" alt="">
                    <div class="tile-gradient"></div>
                    <div class="tile-credit">
                        <div class="tile-credit-pill">
                            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=96&h=96&fit=crop&crop=face" alt="">
                            <span class="text-[11px] font-semibold truncate drop-shadow-[0_1px_3px_rgba(0,0,0,0.35)]">Jane Smith</span>
                        </div>
                        <span class="tile-like-chip"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>842</span></span>
                    </div>
                </article>
                <article class="photo-tile medium">
                    <img src="https://images.unsplash.com/photo-1682695794947-17061dc284dd?w=900&h=1200&fit=crop" alt="">
                    <div class="tile-gradient"></div>
                    <div class="tile-credit">
                        <div class="tile-credit-pill">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=96&h=96&fit=crop&crop=face" alt="">
                            <span class="text-[11px] font-semibold truncate drop-shadow-[0_1px_3px_rgba(0,0,0,0.35)]">Alex Wang</span>
                        </div>
                        <span class="tile-like-chip"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>512</span></span>
                    </div>
                </article>
                <article class="photo-tile tall">
                    <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?w=900&h=1200&fit=crop" alt="">
                    <div class="tile-gradient"></div>
                    <div class="tile-credit">
                        <div class="tile-credit-pill">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=96&h=96&fit=crop&crop=face" alt="">
                            <span class="text-[11px] font-semibold truncate drop-shadow-[0_1px_3px_rgba(0,0,0,0.35)]">Sarah Lee</span>
                        </div>
                        <span class="tile-like-chip"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>3.4k</span></span>
                    </div>
                </article>
            </div>
        </div>
    </div>
</div>
</body>
</html>
