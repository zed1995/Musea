<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musea — Language</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        zinc: {
                            50: '#FAFAFA',
                            100: '#F4F4F5',
                            200: '#E4E4E7',
                            300: '#D4D4D8',
                            400: '#A1A1AA',
                            500: '#71717A',
                            600: '#52525B',
                            700: '#3F3F46',
                            800: '#27272A',
                            900: '#18181B',
                            950: '#09090B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f5f5f4; color: #111; overflow-x: hidden; }
        .icon {
            width: 20px;
            height: 20px;
            display: block;
            flex-shrink: 0;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .icon-sm { width: 16px; height: 16px; }
        .status-bar { background: rgba(250,250,250,0.94); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .topbar-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            background: rgba(255,255,255,0.86);
            border: 1px solid #ECECF0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #27272A;
            box-shadow: 0 10px 24px rgba(24,24,27,0.05);
        }
        .hero-shell {
            background:
                radial-gradient(circle at top right, rgba(24,24,27,0.06), transparent 32%),
                linear-gradient(180deg, #FCFCFD 0%, #F6F5F3 100%);
            border-bottom: 1px solid #ECE9E3;
        }
        .eyebrow {
            font-size: 11px;
            line-height: 1;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 800;
            color: #A8A29E;
        }
        .page-title {
            margin-top: 8px;
            font-size: 31px;
            line-height: 1;
            letter-spacing: -0.05em;
            font-weight: 800;
            color: #18181B;
        }
        .lang-list {
            border-radius: 26px;
            background: rgba(255,255,255,0.92);
            border: 1px solid #EEEBE6;
            box-shadow: 0 16px 34px rgba(24,24,27,0.05);
            overflow: hidden;
        }
        .lang-row {
            min-height: 74px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            background: rgba(255,255,255,0.88);
        }
        .lang-row + .lang-row { border-top: 1px solid #F3F1ED; }
        .lang-row.selected {
            background: linear-gradient(180deg, rgba(24,24,27,0.96) 0%, rgba(39,39,42,0.98) 100%);
            color: #fff;
        }
        .lang-chip {
            min-width: 62px;
            height: 30px;
            padding: 0 12px;
            border-radius: 999px;
            background: #F5F5F4;
            color: #292524;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }
        .lang-row.selected .lang-chip {
            background: rgba(255,255,255,0.12);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }
        .lang-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .check-shell {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #D6D3D1;
            color: transparent;
            flex-shrink: 0;
        }
        .lang-row.selected .check-shell {
            background: #fff;
            border-color: #fff;
            color: #18181B;
        }
    </style>
</head>
<body>
<div class="w-[412px] h-[915px] mx-auto relative overflow-hidden bg-[#F7F5F1]">
    <div class="status-bar fixed top-0 left-0 right-0 z-50 px-6 py-2 flex items-center justify-between" style="width:412px;margin:0 auto;">
        <span class="text-sm font-semibold text-zinc-900">12:30</span>
        <div class="flex items-center gap-2">
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v4"/><path d="M12 11v9"/><path d="M17 6v14"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <svg class="icon icon-sm text-zinc-800" viewBox="0 0 24 24"><rect x="5" y="7" width="13" height="10" rx="2"/><path d="M21 11v2"/><path fill="currentColor" stroke="none" d="M8 10h7v4H8z"/></svg>
        </div>
    </div>

    <div class="pt-[52px] pb-[28px] h-full overflow-y-auto scrollbar-hide">
        <div class="hero-shell px-4 pt-4 pb-6">
            <div class="flex items-center gap-3">
                <div class="topbar-icon-btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                </div>
                <div>
                    <div class="eyebrow">Preferences</div>
                    <h1 class="page-title">Language</h1>
                </div>
            </div>
        </div>

        <div class="px-4 pt-6">
            <div class="lang-list">
                <div class="lang-row selected">
                    <div class="lang-chip">Auto</div>
                    <div class="min-w-0 flex-1">
                        <div class="lang-title">Follow system</div>
                    </div>
                    <div class="check-shell">
                        <svg class="icon-sm" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
                    </div>
                </div>
                <div class="lang-row">
                    <div class="lang-chip">EN</div>
                    <div class="min-w-0 flex-1">
                        <div class="lang-title">English</div>
                    </div>
                    <div class="check-shell">
                        <svg class="icon-sm" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
                    </div>
                </div>
                <div class="lang-row">
                    <div class="lang-chip">中文</div>
                    <div class="min-w-0 flex-1">
                        <div class="lang-title">简体中文</div>
                    </div>
                    <div class="check-shell">
                        <svg class="icon-sm" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
