name: musea
description: A Flutter image discovery app using Unsplash API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Network
  dio: ^5.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Image Caching
  cached_network_image: ^3.3.1
  flutter_blurhash: ^0.8.2
  
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Navigation
  go_router: ^13.1.0
  
  # UI
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  photo_view: ^0.15.0          # Image zoom/pan/fullscreen in detail page

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  dartz: ^0.10.1
  flutter_dotenv: ^5.1.0
  image_gallery_saver: ^2.0.3  # Save downloaded images to device gallery

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mocktail: ^1.0.2

flutter:
  uses-material-design: true
  
  assets:
    - .env
